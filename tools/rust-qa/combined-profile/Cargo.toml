[workspace]
resolver = "3"

[package]
name = "ifw-combined-assessment"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
publish = false

[dependencies]
desktop-lifecycle = { path = "../../../rust/crates/desktop-lifecycle" }
desktop-platform-log = { path = "../../../rust/crates/desktop-platform-log" }
ifw-immich = { path = "../../../rust/crates/ifw-immich" }
ifw-legacy = { path = "../../../rust/crates/ifw-legacy" }
safe-fs = { path = "../../../rust/crates/safe-fs" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "wgpu_no_default_features"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "parking_lot", "wgsl"] }
winit = { version = "=0.30.13", default-features = false }
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "backup"] }
sha2 = { version = "=0.11.1", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
serde-saphyr = { version = "=2.2.0", default-features = false, features = ["deserialize", "serialize"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "macros", "time", "sync"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "=2.5.0"
async-io = "=2.6.0"
futures-lite = "=2.6.1"
md-5 = { version = "=0.11.0", default-features = false }
percent-encoding = { version = "=2.3.2", default-features = false }
raw-window-handle = "=0.6.2"
wayland-backend = { version = "=0.3.17", features = ["client_system", "dlopen"] }
wayland-client = "=0.31.15"
wayland-protocols-plasma = { version = "=0.3.12", default-features = false, features = ["client"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable"] }
eframe = { version = "=0.37.0", default-features = false, features = ["x11", "wayland"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["vulkan"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "wayland", "x11"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.0", default-features = false, features = ["dx12"] }
windows = { version = "=0.62.2", default-features = false, features = [
    "std", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
egui = { path = "../gui/artifacts/text/egui" }
epaint = { path = "../gui/artifacts/text/epaint" }
hyper-util = { path = "../../../artifacts/rust/realtime-sources/hyper-util" }

[lints.rust]
unsafe_code = "forbid"
