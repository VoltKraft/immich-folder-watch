[workspace]
resolver = "3"

[package]
name = "ifw-realtime-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "ifw_windows_proxy_settings"
path = "src/windows_settings.rs"
test = false
doctest = false

[patch.crates-io]
hyper-util = { path = "../../../artifacts/rust/realtime-sources/hyper-util" }

[dependencies]
ifw-immich = { path = "../../../rust/crates/ifw-immich" }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "linux")'.dependencies]
md-5 = { version = "=0.11.0", default-features = false }
percent-encoding = { version = "=2.3.2", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["io-util"] }

[lints.rust]
unsafe_code = "deny"
