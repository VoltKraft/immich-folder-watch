[package]
name = "native-gui-assessment"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace]
resolver = "3"

[dependencies]
desktop-lifecycle = { path = "../../../rust/crates/desktop-lifecycle" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "wgpu_no_default_features"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "parking_lot", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
ifw-yaml-assessment = { path = "../yaml" }
winit = { version = "=0.30.13", default-features = false }
futures-lite = "=2.6.1"
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
eframe = { version = "=0.37.0", default-features = false, features = ["x11", "wayland"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
winit = { version = "=0.30.13", default-features = false }
wgpu = { version = "=30.0.0", default-features = false, features = ["dx12"] }
windows = { version = "=0.62.2", default-features = false, features = [
    "std", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
    "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
egui = { path = "artifacts/text/egui" }
epaint = { path = "artifacts/text/epaint" }
