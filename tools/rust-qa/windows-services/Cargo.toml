[workspace]
resolver = "3"

[package]
name = "ifw-windows-services-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
publish = false

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = [
    "std",
    "Data_Xml_Dom", "UI_Notifications", "Win32_Storage_EnhancedStorage",
    "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
