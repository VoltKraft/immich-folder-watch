immich:
  serverApiUrl: "https://immich.example.com/api"
  apiKey: "REPLACE_WITH_IMMICH_API_KEY"

watch:
  sources:
    - path: "C:\\Users\\YOUR_USER\\Pictures\\Screenshots"
      albumName: "Screenshots"
      includeSubdirectories: false
    - path: "C:\\Users\\YOUR_USER\\Pictures\\Camera"
      albumName: "Camera Imports"
      includeSubdirectories: true
  extensions:
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".heic"
    - ".webp"
    - ".mp4"
  batchIntervalSeconds: 5
  maxBatchSize: 25
  fileReadyTimeoutSeconds: 30

retry:
  maxAttempts: 5
  baseDelayMilliseconds: 500

logging:
  level: "Information"
  logDirectory: "C:\\ImmichFolderWatch\\logs"
