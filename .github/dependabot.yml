version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tools/BrandAssetGen
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Avalonia.Headless.XUnit 12.0.3 uses the pre-4.0 xUnit extension API.
    # Revisit when its bridge supports xUnit 4.x and the VSTest workflow is validated.
    ignore:
      - dependency-name: xunit.v3
        versions:
          - "[4.0.0,)"
    # Keep related packages aligned across application, test and tool projects.
    groups:
      avalonia:
        patterns:
          - Avalonia*
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
      skiasharp:
        patterns:
          - SkiaSharp*
      xunit:
        patterns:
          - xunit*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
