version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tools/BrandAssetGen
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Keep related packages aligned across application, test and tool projects.
    groups:
      avalonia:
        patterns:
          - Avalonia*
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
      skiasharp:
        patterns:
          - SkiaSharp*
      xunit:
        patterns:
          - xunit*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
