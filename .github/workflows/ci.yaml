name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ImmichFolderWatch.sln

      - name: Build
        run: dotnet build ImmichFolderWatch.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ImmichFolderWatch.sln --configuration Release --no-build
