name: CI

on:
  push:
    branches:
      - main
      - develop
      - Flatpak
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pages-artifact:
    name: Validate Pages artifact
    uses: ./.github/workflows/pages-artifact-validation.yaml

  validate-flatpak:
    name: Validate native Flatpak packages
    uses: ./.github/workflows/flatpak-validation.yaml

  build-windows:
    name: Build and Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test workflow security on PowerShell
        run: python -m unittest discover -s tools/tests -p test_workflow_security.py -v

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.401

      - name: Build reduced Avalonia from pinned sources
        run: python tools/prepare_reduced_avalonia.py

      - name: Restore
        run: dotnet restore ImmichFolderWatch.sln

      - name: Build
        run: dotnet build ImmichFolderWatch.sln --configuration Release --no-restore

      - name: Verify reduced Avalonia package provenance
        run: python tools/verify_reduced_avalonia.py

      - name: Test
        run: dotnet test ImmichFolderWatch.sln --configuration Release --no-build

      - name: Test Windows installer contract
        run: |
          python -m unittest discover -s tools/tests -p test_windows_installer.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/tests -p test_msi_upgrade_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and validate Windows MSI candidates
        run: |
          foreach ($runtime in @("win-x64", "win-arm64")) {
            & .\packaging\windows\build-msi.ps1 -Runtime $runtime
          }

  build-linux:
    name: Build and Test (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.401

      - name: Install portal protocol test tools
        run: |
          # Retain Ubuntu's signing keys while avoiding an unavailable runner mirror.
          if [ -f /etc/apt/apt-mirrors.txt ] && ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            mirror=""
            for candidate in archive.ubuntu.com mirrors.edge.kernel.org; do
              if getent hosts "$candidate" >/dev/null; then mirror="$candidate"; break; fi
            done
            if [ -z "$mirror" ]; then echo "No Ubuntu mirror resolves on this runner" >&2; exit 1; fi
            printf 'https://%s/ubuntu\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get update && sudo apt-get install -y dbus-daemon xdg-dbus-proxy

      - name: Build reduced Avalonia from pinned sources
        run: python3 tools/prepare_reduced_avalonia.py

      - name: Restore Linux-portable projects
        run: |
          dotnet restore src/ImmichFolderWatch.App.Linux/ImmichFolderWatch.App.Linux.csproj
          dotnet restore src/ImmichFolderWatch.Tests.Core/ImmichFolderWatch.Tests.Core.csproj
          dotnet restore src/ImmichFolderWatch.Tests.Linux/ImmichFolderWatch.Tests.Linux.csproj

      - name: Build
        run: |
          dotnet build src/ImmichFolderWatch.App.Linux/ImmichFolderWatch.App.Linux.csproj --configuration Release --no-restore
          dotnet build src/ImmichFolderWatch.Tests.Core/ImmichFolderWatch.Tests.Core.csproj --configuration Release --no-restore
          dotnet build src/ImmichFolderWatch.Tests.Linux/ImmichFolderWatch.Tests.Linux.csproj --configuration Release --no-restore

      - name: Verify reduced Avalonia package provenance
        run: python3 tools/verify_reduced_avalonia.py

      - name: Test
        run: |
          dotnet test src/ImmichFolderWatch.Tests.Core/ImmichFolderWatch.Tests.Core.csproj --configuration Release --no-build
          dotnet test src/ImmichFolderWatch.Tests.Linux/ImmichFolderWatch.Tests.Linux.csproj --configuration Release --no-build

  lint-flatpak:
    name: Lint Flatpak packaging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate GitHub Script runtime compatibility
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Exercise the release scripts' APIs without changing remote state.
            const updateFlathubPullRequest = require('./tools/update-flathub-pr.cjs');
            if (typeof updateFlathubPullRequest !== 'function') {
              throw new Error('The Flathub helper must remain loadable as CommonJS.');
            }
            const { data: repository } = await github.rest.repos.get(context.repo);
            if (repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('The GitHub client returned an unexpected repository.');
            }
            core.setOutput('default_branch', repository.default_branch);

      - name: Install validators
        run: |
          # Retain Ubuntu's signing keys while avoiding an unavailable runner mirror.
          if [ -f /etc/apt/apt-mirrors.txt ] && ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            mirror=""
            for candidate in archive.ubuntu.com mirrors.edge.kernel.org; do
              if getent hosts "$candidate" >/dev/null; then mirror="$candidate"; break; fi
            done
            if [ -z "$mirror" ]; then echo "No Ubuntu mirror resolves on this runner" >&2; exit 1; fi
            printf 'https://%s/ubuntu\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream \
            desktop-file-utils \
            flatpak-builder \
            ostree \
            gnupg

      - name: Validate AppStream metainfo
        # `--no-net` keeps the lint passing on PR/dev pushes where the
        # release-tag-pinned screenshot URL isn't live yet. Flathub's
        # own pipeline fetches screenshots at build time, when the
        # v<N> tag exists.
        run: appstreamcli validate --no-net packaging/flatpak/io.github.voltkraft.immich-folder-watch.metainfo.xml

      - name: Validate desktop entry
        run: desktop-file-validate packaging/flatpak/io.github.voltkraft.immich-folder-watch.desktop

      - name: Dry-parse shared Flatpak manifest
        # The same manifest feeds future Flathub submission and the
        # commit-pinned GitHub release bundle.
        run: |
          # An empty source list is silently discarded by some Builder versions.
          # This parse-only inline source exercises sibling-list resolution.
          printf '[{"type":"inline","contents":"parse-only","dest-filename":".ci-parse-only"}]\n' > packaging/flatpak/flathub/nuget-sources.json
          flatpak-builder --show-manifest \
            packaging/flatpak/flathub/io.github.voltkraft.immich-folder-watch.yml \
            > /tmp/flatpak-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/flatpak-manifest.json').read_text())
          sources = manifest['modules'][0]['sources']
          assert [source['type'] for source in sources] == ['git', 'archive', 'archive', 'file', 'inline']
          PY

      - name: Validate shared SDK pins
        run: python3 tools/read-flatpak-sdk.py --manifest packaging/flatpak/flathub/io.github.voltkraft.immich-folder-watch.yml --format json

      - name: Check Flatpak NuGet generator arguments
        run: |
          bash -n tools/generate-nuget-sources.sh
          tools/generate-nuget-sources.sh --help
          if tools/generate-nuget-sources.sh --runtime linux-riscv64; then
            echo "Unsupported Flatpak runtime was accepted." >&2
            exit 1
          fi

      - name: Setup pinned SDK for source-builder regression tests
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.401

      - name: Test release tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Test Flathub update automation
        run: node --test tools/tests/test_update_flathub_pr.cjs
