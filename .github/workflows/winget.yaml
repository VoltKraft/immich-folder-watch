name: WinGet

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional published tag to submit, for example v1.4.0
        required: false
        type: string

permissions:
  contents: read

jobs:
  submit-winget-update:
    name: Submit WinGet Update
    runs-on: windows-latest

    steps:
      - name: Determine checkout ref
        id: ref
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          WORKFLOW_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $manualTag = ([string]$env:MANUAL_TAG).Trim()
          $workflowRef = $env:WORKFLOW_SHA
          $stableTagPattern = '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z'
          if ($manualTag -and $manualTag -cnotmatch $stableTagPattern) {
              throw "release_tag must be a stable vMAJOR.MINOR.PATCH tag."
          }

          if ($env:EVENT_NAME -eq "release") {
              $targetRef = $env:EVENT_RELEASE_TAG
              if ($targetRef -cnotmatch $stableTagPattern) {
                  throw "The release event must use a stable vMAJOR.MINOR.PATCH tag."
              }
              $releaseTag = $targetRef
          }
          elseif (-not [string]::IsNullOrWhiteSpace($manualTag)) {
              $targetRef = $workflowRef
              $releaseTag = $manualTag
          }
          else {
              $targetRef = $workflowRef
              $releaseTag = ""
          }

          "target_ref=$targetRef" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.target_ref }}

      - name: Read WinGet metadata
        id: metadata
        shell: pwsh
        run: |
          $metadata = Get-Content packaging/winget/package.metadata.json -Raw | ConvertFrom-Json
          $automationEnabled = ([string]$metadata.automationEnabled).ToLowerInvariant()
          "package_identifier=$($metadata.packageIdentifier)" >> $env:GITHUB_OUTPUT
          "automation_enabled=$automationEnabled" >> $env:GITHUB_OUTPUT

      - name: Stop if WinGet automation is not enabled yet
        if: steps.metadata.outputs.automation_enabled != 'true'
        shell: pwsh
        run: |
          Write-Host "WinGet automation is disabled in packaging/winget/package.metadata.json."
          Write-Host "Enable automation there before submitting updates."

      - name: Read release version
        if: steps.metadata.outputs.automation_enabled == 'true'
        id: version
        shell: pwsh
        env:
          SELECTED_TAG: ${{ steps.ref.outputs.release_tag }}
        run: |
          $selectedTag = $env:SELECTED_TAG

          if (-not [string]::IsNullOrWhiteSpace($selectedTag)) {
              $version = $selectedTag.TrimStart('v')
          }
          else {
              [xml]$props = Get-Content Directory.Build.props
              $version = $props.Project.PropertyGroup.Version
          }

          if ($version -cnotmatch '\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z') {
              throw "Version must be stable MAJOR.MINOR.PATCH."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download release MSIs and collect installer metadata
        if: steps.metadata.outputs.automation_enabled == 'true'
        id: installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_VERSION
          $releaseTag = "v$version"
          $metadata = Get-Content packaging/winget/package.metadata.json -Raw | ConvertFrom-Json
          $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "User-Agent" = "immich-folder-watch-winget-release"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUrl = "https://api.github.com/repos/$env:REPOSITORY/releases/tags/$releaseTag"
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers

          if ($release.draft -or $release.tag_name -ne $releaseTag) {
              throw "Release $releaseTag is missing, a draft, or returned an unexpected tag."
          }
          if ([string]::IsNullOrWhiteSpace([string]$release.published_at)) {
              throw "Release $releaseTag has no publication date."
          }

          $downloadRoot = Join-Path $PWD "artifacts\winget-msi"
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
          $installerMetadata = @()

          function Get-MsiProperty {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path,
                  [Parameter(Mandatory = $true)]
                  [string]$Property
              )

              $installer = New-Object -ComObject WindowsInstaller.Installer
              try {
                  $database = $installer.GetType().InvokeMember(
                      "OpenDatabase",
                      "InvokeMethod",
                      $null,
                      $installer,
                      @($Path, 0)
                  )
                  $query = "SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = '$Property'"
                  $view = $database.GetType().InvokeMember(
                      "OpenView",
                      "InvokeMethod",
                      $null,
                      $database,
                      @($query)
                  )
                  $view.GetType().InvokeMember(
                      "Execute",
                      "InvokeMethod",
                      $null,
                      $view,
                      $null
                  ) | Out-Null
                  $record = $view.GetType().InvokeMember(
                      "Fetch",
                      "InvokeMethod",
                      $null,
                      $view,
                      $null
                  )
                  if ($null -eq $record) {
                      throw "MSI property '$Property' was not found in $Path."
                  }
                  return [string]$record.GetType().InvokeMember(
                      "StringData",
                      "GetProperty",
                      $null,
                      $record,
                      1
                  )
              }
              finally {
                  if ($null -ne $record) { [void][Runtime.InteropServices.Marshal]::ReleaseComObject($record) }
                  if ($null -ne $view) { [void][Runtime.InteropServices.Marshal]::ReleaseComObject($view) }
                  if ($null -ne $database) { [void][Runtime.InteropServices.Marshal]::ReleaseComObject($database) }
                  [void][Runtime.InteropServices.Marshal]::ReleaseComObject($installer)
              }
          }

          function Get-MsiTemplate {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              $installer = New-Object -ComObject WindowsInstaller.Installer
              try {
                  $database = $installer.GetType().InvokeMember(
                      "OpenDatabase",
                      "InvokeMethod",
                      $null,
                      $installer,
                      @($Path, 0)
                  )
                  $summary = $database.GetType().InvokeMember(
                      "SummaryInformation",
                      "GetProperty",
                      $null,
                      $database,
                      @(0)
                  )
                  return [string]$summary.GetType().InvokeMember(
                      "Property",
                      "GetProperty",
                      $null,
                      $summary,
                      7
                  )
              }
              finally {
                  if ($null -ne $summary) { [void][Runtime.InteropServices.Marshal]::ReleaseComObject($summary) }
                  if ($null -ne $database) { [void][Runtime.InteropServices.Marshal]::ReleaseComObject($database) }
                  [void][Runtime.InteropServices.Marshal]::ReleaseComObject($installer)
              }
          }

          foreach ($architecture in @("x64", "arm64")) {
              $template = [string]$metadata.releaseAssetNameTemplates.$architecture
              if ([string]::IsNullOrWhiteSpace($template)) {
                  throw "Missing release asset template for $architecture."
              }
              $assetName = $template.Replace("{version}", $version)
              $assets = @($release.assets | Where-Object { $_.name -eq $assetName })
              if ($assets.Count -ne 1) {
                  throw "Expected exactly one release asset named '$assetName'; found $($assets.Count)."
              }

              $msiPath = Join-Path $downloadRoot $assetName
              Invoke-WebRequest `
                  -Uri $assets[0].browser_download_url `
                  -Headers $headers `
                  -OutFile $msiPath

              $productVersion = Get-MsiProperty -Path $msiPath -Property "ProductVersion"
              if ($productVersion -ne $version) {
                  throw "MSI '$assetName' has ProductVersion '$productVersion', expected '$version'."
              }
              $expectedTemplate = if ($architecture -eq "arm64") { "Arm64" } else { "x64" }
              $actualTemplate = Get-MsiTemplate -Path $msiPath
              if ($actualTemplate -notmatch "^$expectedTemplate;") {
                  throw "MSI '$assetName' has template '$actualTemplate', expected '$expectedTemplate'."
              }

              $installerMetadata += [ordered]@{
                  architecture = $architecture
                  url = [string]$assets[0].browser_download_url
                  sha256 = (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash
                  productCode = (Get-MsiProperty -Path $msiPath -Property "ProductCode")
              }
          }

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $installerMetadata |
              ConvertTo-Json -Depth 3 |
              Set-Content artifacts\winget-installers.json -Encoding utf8

          $releaseDate = ([DateTimeOffset]$release.published_at).UtcDateTime.ToString("yyyy-MM-dd")
          "release_date=$releaseDate" >> $env:GITHUB_OUTPUT

      - name: Generate multi-architecture WinGet manifests
        if: steps.metadata.outputs.automation_enabled == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DATE: ${{ steps.installers.outputs.release_date }}
        run: |
          python tools\prepare-winget-release-manifests.py `
            --metadata packaging\winget\package.metadata.json `
            --installers artifacts\winget-installers.json `
            --output-dir artifacts\winget-manifests `
            --version "$env:RELEASE_VERSION" `
            --release-date "$env:RELEASE_DATE"

      - name: Ensure WinGet token is available
        if: steps.metadata.outputs.automation_enabled == 'true'
        shell: pwsh
        env:
          WINGETCREATE_TOKEN: ${{ secrets.WINGETCREATE_TOKEN || secrets.WINGET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGETCREATE_TOKEN)) {
              throw "Missing repository secret WINGETCREATE_TOKEN or WINGET."
          }

      - name: Setup .NET 6 for wingetcreate
        if: steps.metadata.outputs.automation_enabled == 'true'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 6.0.x

      - name: Download and verify pinned wingetcreate
        if: steps.metadata.outputs.automation_enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Official v1.12.13.0 executable and release-published SHA-256, reviewed together.
          Invoke-WebRequest "https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe" -OutFile wingetcreate.exe
          $expectedHash = "24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA"
          if ((Get-FileHash -LiteralPath wingetcreate.exe -Algorithm SHA256).Hash -ne $expectedHash) {
              Remove-Item -LiteralPath wingetcreate.exe -Force
              throw "wingetcreate SHA-256 verification failed."
          }

      - name: Submit WinGet package update
        if: steps.metadata.outputs.automation_enabled == 'true'
        shell: pwsh
        env:
          WINGETCREATE_TOKEN: ${{ secrets.WINGETCREATE_TOKEN || secrets.WINGET }}
          PACKAGE_IDENTIFIER: ${{ steps.metadata.outputs.package_identifier }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          .\wingetcreate.exe submit `
            artifacts\winget-manifests `
            --prtitle "New version: $env:PACKAGE_IDENTIFIER version $env:RELEASE_VERSION" `
            --token "$env:WINGETCREATE_TOKEN" `
            --no-open
