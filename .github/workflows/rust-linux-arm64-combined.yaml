name: Rust combined profile on native Ubuntu ARM64

on:
  push:
    branches: [rewrite/rust]
    paths:
      - '.github/workflows/rust-linux-arm64-combined.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/rewrite/rust'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      NATIVE_TARGET: aarch64-unknown-linux-gnu
      COMBINED: tools/rust-qa/combined-profile
      AREA: artifacts/rust/combined-profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the native compiler and namespace
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor bubblewrap binutils build-essential pkg-config python3-jsonschema
          bash tools/rust-qa/hosted-linux-namespace.sh prepare
          bash tools/rust-qa/install-toolchain.sh "$NATIVE_TARGET"

      - name: Acquire and authenticate the sources, fonts, original licenses and SPDX schema
        run: |
          PYTHONPATH=tools/rust-qa /usr/bin/python3 -B -c 'from gui import source_profile; source_profile.prepare(fetch=True)'
          /usr/bin/python3 -B tools/rust-qa/native-notice-input.py cache --fetch-missing
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 \
            https://raw.githubusercontent.com/spdx/spdx-spec/v2.3.1/schemas/spdx-schema.json --output "$RUNNER_TEMP/spdx-schema.json"
          echo "4126dc29f15e92feec92e9622f4939131ad58b125d6f578aa93e980a6e6f3212  $RUNNER_TEMP/spdx-schema.json" | sha256sum --check

      - name: Compile and execute the native profile, upload corpus and Wayland relink twice
        run: |
          first="$AREA/runs/$NATIVE_TARGET"
          repeat="$AREA/runs/$NATIVE_TARGET-repeat"
          for output in "$first" "$repeat"; do
            /usr/bin/python3 -B "$COMBINED/run.py" --native "$NATIVE_TARGET" --relink --output "$output"
          done
          for item in profile.json inventory.json source-trees.json legacy-upload.json smoke.json relink-smoke.json; do
            cmp "$first/$item" "$repeat/$item"
          done

      - name: Record the two native compiler receipts and schema-checked SPDX
        run: |
          for suffix in '' '-repeat'; do
            /usr/bin/python3 -B tools/rust-qa/native-notice-input.py pack "$NATIVE_TARGET" --revision "$GITHUB_SHA" \
              --input "$AREA/runs/$NATIVE_TARGET$suffix" --output "$AREA/receipts/rust-native-input-$NATIVE_TARGET-$GITHUB_SHA$suffix.zip"
          done
          /usr/bin/python3 -B "$COMBINED/sbom.py" "$NATIVE_TARGET" --revision "$GITHUB_SHA" \
            --input "$AREA/runs/$NATIVE_TARGET" --output "$AREA/sboms/$NATIVE_TARGET.spdx.json"
          /usr/bin/python3 -B "$COMBINED/test_sbom.py" --target "$NATIVE_TARGET" --revision "$GITHUB_SHA" \
            --input "$AREA/runs/$NATIVE_TARGET" --document "$AREA/sboms/$NATIVE_TARGET.spdx.json" --schema "$RUNNER_TEMP/spdx-schema.json"

      - name: Retain the exact native compiler ZIP
        id: receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: artifacts/rust/combined-profile/receipts/rust-native-input-aarch64-unknown-linux-gnu-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Retain the independent native build and relink
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: artifacts/rust/combined-profile/receipts/rust-native-input-aarch64-unknown-linux-gnu-${{ github.sha }}-repeat.zip
          if-no-files-found: error
          retention-days: 14

      - name: Reproduce the SPDX and source notices using the Actions digest
        env:
          RECEIPT_DIGEST: ${{ steps.receipt.outputs.artifact-digest }}
        run: |
          input="$AREA/receipts/rust-native-input-$NATIVE_TARGET-$GITHUB_SHA.zip"
          notices="$AREA/notices/rust-notices-$NATIVE_TARGET-$GITHUB_SHA.zip"
          digest="${RECEIPT_DIGEST#sha256:}"
          args=(--revision "$GITHUB_SHA" --input "$input" --archive-sha256 "$digest")
          /usr/bin/python3 -B "$COMBINED/sbom.py" "$NATIVE_TARGET" "${args[@]}" --output "$RUNNER_TEMP/replayed.spdx.json"
          cmp "$AREA/sboms/$NATIVE_TARGET.spdx.json" "$RUNNER_TEMP/replayed.spdx.json"
          /usr/bin/python3 -B "$COMBINED/test_sbom.py" --target "$NATIVE_TARGET" "${args[@]}" \
            --document "$RUNNER_TEMP/replayed.spdx.json" --schema "$RUNNER_TEMP/spdx-schema.json"
          /usr/bin/python3 -B "$COMBINED/notices.py" "$NATIVE_TARGET" "${args[@]}" --output "$notices"
          /usr/bin/python3 -B "$COMBINED/test_notices.py" --target "$NATIVE_TARGET" "${args[@]}" --notices "$notices"
          /usr/bin/python3 -B "$COMBINED/notices.py" "$NATIVE_TARGET" "${args[@]}" --output "$RUNNER_TEMP/replayed-notices.zip"
          cmp "$notices" "$RUNNER_TEMP/replayed-notices.zip"

      - name: Retain the original notice archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: artifacts/rust/combined-profile/notices/rust-notices-aarch64-unknown-linux-gnu-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Retain target-specific SPDX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: artifacts/rust/combined-profile/sboms/aarch64-unknown-linux-gnu.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove the job-specific namespace helper
        if: always()
        run: bash tools/rust-qa/hosted-linux-namespace.sh cleanup

      - name: Retain diagnostics from incomplete native checks
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-combined-linux-arm64-diagnostics-${{ github.sha }}
          path: |
            artifacts/rust/combined-profile/runs/*/result.json
            artifacts/rust/combined-profile/runs/*/build.log
            artifacts/rust/combined-profile/runs/*/clippy.log
            artifacts/rust/combined-profile/runs/*/relink.log
          if-no-files-found: ignore
          retention-days: 14
