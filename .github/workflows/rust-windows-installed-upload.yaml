name: Rust backup of an installed Windows upload

on:
  push:
    branches: [rewrite/rust]
    paths:
      - '.github/workflows/rust-windows-installed-upload.yaml'
      - 'tools/rust-qa/windows-msi-interop/**'
      - '!tools/rust-qa/windows-msi-interop/**/*.md'
      - 'tools/rust-qa/storage/**'
      - '!tools/rust-qa/storage/**/*.md'
      - 'tools/rust-qa/windows-performance/native.py'
      - 'tools/RustCompatibilityOracle/installed/interop/shipping_upload.py'
      - 'tools/RustCompatibilityOracle/installed/interop/installed_backup.py'
      - 'tools/RustCompatibilityOracle/installed/windows.ps1'
      - 'tools/RustCompatibilityOracle/installed/run.py'
      - 'tools/RustCompatibilityOracle/installed/release.json'
      - 'packaging/windows/Test-InstallerUpgradeContract.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    if: github.ref == 'refs/heads/rewrite/rust'
    name: Installed WPF upload and restore (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, target: x86_64-pc-windows-msvc, runner: windows-2025}
          - {arch: arm64, target: aarch64-pc-windows-msvc, runner: windows-11-arm}
    env:
      NATIVE_TARGET: ${{ matrix.target }}
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/rust/assessment-nuget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned native compiler
        shell: bash
        run: bash tools/rust-qa/install-toolchain.sh "$NATIVE_TARGET"

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.401
          architecture: ${{ matrix.arch }}

      - name: Prepare the reviewed inputs and build the native backup helper offline
        shell: bash
        run: |
          export PATH="$PWD/artifacts/rust/toolchain/bin:$PATH"
          export CARGO_HOME="$PWD/artifacts/rust/storage-cargo-home"
          cargo fetch --locked --manifest-path tools/rust-qa/storage/Cargo.toml
          dotnet restore tools/rust-qa/storage/dotnet/StorageReadback.csproj --artifacts-path artifacts/rust/installed-upload-restore -p:EnableWindowsTargeting=false
          python -B tools/rust-qa/storage/run.py "$NATIVE_TARGET" --offline --installed-upload-backup \
            --output "artifacts/rust/storage-native/$NATIVE_TARGET"

      - name: Exercise the installed worker and return its live backup
        id: observe
        shell: pwsh
        run: |
          $root = 'tools/rust-qa/windows-msi-interop'
          & "$root/test_install.ps1"
          & "$root/upload/test_profile.ps1"
          python -B -m unittest discover -s "$root/upload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = "artifacts/rust/windows-msi-interop/upload/$env:NATIVE_TARGET"
          python -B "$root/upload/run.py" $env:NATIVE_TARGET --rust-backup "artifacts/rust/storage-native/$env:NATIVE_TARGET"
          $trial = $LASTEXITCODE
          if ($trial -ne 0) {
            if (Test-Path -LiteralPath "$evidence/live.json") {
              python -B "$root/upload/readback.py" $evidence --live-only
            }
            exit $trial
          }
          python -B "$root/upload/readback.py" $evidence
          exit $LASTEXITCODE

      - name: Retain original uploads, databases, compiler and installer receipts
        if: ${{ !cancelled() && steps.observe.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-windows-installed-upload-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/rust/windows-msi-interop/upload/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
