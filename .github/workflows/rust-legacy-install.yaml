name: Rust migration reference installers

on:
  push:
    branches: [rewrite/rust]
    paths:
      - '.github/workflows/rust-legacy-install.yaml'
      - 'tools/RustCompatibilityOracle/installed/**'
      - 'rust/tests/fixtures/legacy/**'
      - 'tools/rust-qa/performance/linux.py'
      - 'tools/rust-qa/hosted-linux-namespace.*'
      - 'packaging/windows/Test-InstallerUpgradeContract.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-legacy-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/rewrite/rust'
    name: Shipping 3.0.4 (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-2025, target: windows-x64 }
          - { runner: windows-11-arm, target: windows-arm64 }
    steps:
      - name: Check out the test and its original release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the native Flatpak and OSTree tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends flatpak ostree bubblewrap
          bash tools/rust-qa/hosted-linux-namespace.sh prepare

      - name: Check package and retained-profile verification
        run: python -B -m unittest discover -s tools/RustCompatibilityOracle/installed -p test_common.py

      - name: Check the Windows payload and cleanup controls
        if: runner.os == 'Windows'
        run: ./tools/RustCompatibilityOracle/installed/test_windows.ps1

      - name: Check the Linux payload and profile controls
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s tools/RustCompatibilityOracle/installed -p test_linux.py

      - name: Exercise the published package against the synthetic profile
        run: python -B tools/RustCompatibilityOracle/installed/run.py "${{ matrix.target }}" "${{ runner.temp }}/shipping-install"

      - name: Remove the job-specific namespace launcher
        if: ${{ always() && runner.os == 'Linux' }}
        run: bash tools/rust-qa/hosted-linux-namespace.sh cleanup

      - name: Retain original profile bytes and native package observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shipping-3.0.4-install-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/shipping-install/
          if-no-files-found: error
          retention-days: 14
