name: Native Flatpak validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare commit-pinned Flatpak candidate
    runs-on: ubuntu-24.04
    container:
      # Tooling image only: Builder installs the manifest's 26.08 runtime/SDK.
      # Switch the image when Flathub publishes its freedesktop-26.08 image tag.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae
      options: --privileged
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Read pinned candidate SDK
        id: flatpak_sdk
        run: |
          sdk_version=$(python3 source/tools/read-flatpak-sdk.py --manifest source/packaging/flatpak/flathub/io.github.voltkraft.immich-folder-watch.yml --format version)
          echo "version=$sdk_version" >> "$GITHUB_OUTPUT"

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ steps.flatpak_sdk.outputs.version }}

      - name: Generate both offline NuGet feeds
        run: |
          source/tools/generate-nuget-sources.sh --source-root "$PWD/source" \
            --runtime linux-x64 --output "$PWD/source/artifacts/flatpak-validation/nuget-x64.json"
          source/tools/generate-nuget-sources.sh --source-root "$PWD/source" \
            --runtime linux-arm64 --output "$PWD/source/artifacts/flatpak-validation/nuget-arm64.json"

      - name: Prepare and validate candidate packaging
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 source/tools/prepare-flatpak-validation.py \
            --source-root source --commit "$SOURCE_COMMIT" \
            --nuget-x64 source/artifacts/flatpak-validation/nuget-x64.json \
            --nuget-arm64 source/artifacts/flatpak-validation/nuget-arm64.json \
            --output-dir flatpak-validation
          flatpak-builder --show-manifest flatpak-validation/io.github.voltkraft.immich-folder-watch.yml > /dev/null

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flatpak-candidate-${{ github.sha }}
          path: flatpak-validation/
          if-no-files-found: error

  validate:
    name: Build and lint Flatpak (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    container:
      # Tooling image only: Builder installs the manifest's 26.08 runtime/SDK.
      # Switch the image when Flathub publishes its freedesktop-26.08 image tag.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae
      options: --privileged
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: flatpak-candidate-${{ github.sha }}
          path: flatpak-validation

      - name: Build immutable candidate from the combined offline feed
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: flatpak-validation/io.github.voltkraft.immich-folder-watch.yml
          bundle: flatpak-candidate-${{ github.sha }}-${{ matrix.arch }}.flatpak
          artifact-name: flatpak-validation-${{ github.sha }}-${{ matrix.arch }}
          arch: ${{ matrix.arch }}
          branch: test
          repo-dir: repo
          mirror-screenshots-url: https://dl.flathub.org/media
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo

      - name: Validate Flathub repository
        run: flatpak-builder-lint repo repo
