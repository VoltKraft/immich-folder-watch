name: Validate Pages artifact

on:
  workflow_call:

permissions:
  contents: read

jobs:
  round-trip:
    name: Pages upload round trip (hidden=${{ matrix.include-hidden }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include-hidden: ['false', 'true']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Create synthetic Pages snapshot
        run: python3 tools/check-pages-artifact.py create artifacts/pages-fixture

      # Only synthetic files are uploaded; no Pages environment or deployment.
      - name: Upload Pages fixture
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: pages-validation-${{ matrix.include-hidden }}
          path: artifacts/pages-fixture
          retention-days: 1
          include-hidden-files: ${{ matrix.include-hidden }}

      - name: Download uploaded artifact by ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact_id }}
          path: artifacts/pages-download
          merge-multiple: true

      - name: Verify Pages archive layout and contents
        env:
          INCLUDE_HIDDEN: ${{ matrix.include-hidden }}
        run: |
          test "$(find artifacts/pages-download -type f | wc -l)" -eq 1
          python3 tools/check-pages-artifact.py verify artifacts/pages-download/artifact.tar \
            --include-hidden-files "$INCLUDE_HIDDEN"
