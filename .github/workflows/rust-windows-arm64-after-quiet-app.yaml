name: Rust Windows ARM64 notification in app state after quiet time

on:
  push:
    branches: [rewrite/rust]
    paths: ['.github/workflows/rust-windows-arm64-after-quiet-app.yaml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  after_quiet:
    name: Observe the original sender through foreground and desktop UI Automation roots
    if: github.ref == 'refs/heads/rewrite/rust'
    uses: ./.github/workflows/rust-windows-arm64-notification.yaml
    with:
      wait_eligible: true
      after_quiet_app: true
