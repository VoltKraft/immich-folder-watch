            artifacts/rust/windows-reader/native-*/gui/*.json
            artifacts/rust/windows-imports/runs/*/result.json
            artifacts/rust/windows-imports/build-*/winit-published/inputs.rsp
            artifacts/rust/windows-imports/build-*/winit-published/symbols.map
            artifacts/rust/windows-imports/build-*/winit-llvm/inputs.rsp
            artifacts/rust/windows-imports/build-*/winit-llvm/symbols.map
            artifacts/rust/linux-services/inputs.json
            artifacts/rust/linux-services/documents-*/*.json
            artifacts/rust/linux-services/documents-*/*.log
            artifacts/rust/linux-services/tray-*/*.json
            artifacts/rust/linux-services/tray-*/*.log
            artifacts/rust/portal-noble/runs/*/result.json
            artifacts/rust/portal-noble/runs/*/packaged/*.json
            artifacts/rust/portal-noble/runs/*/packaged/*.log
            artifacts/rust/portal-noble/runs/*/unmodified/*.json
            artifacts/rust/portal-noble/runs/*/unmodified/*.log
            artifacts/rust/portal-noble/runs/*/backport/*.json
