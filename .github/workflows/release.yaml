name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-artifacts:
    name: Build Release Artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ImmichFolderWatch.sln

      - name: Publish daemon
        run: dotnet publish src/ImmichFolderWatch.Daemon/ImmichFolderWatch.Daemon.csproj -c Release -o artifacts/${{ matrix.os }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immich-folder-watch-${{ matrix.os }}
          path: artifacts/${{ matrix.os }}

  draft-release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-artifacts

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
