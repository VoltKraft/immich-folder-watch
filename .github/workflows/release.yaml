name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == 'main'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.tag_check.outputs.tag_exists }}
      target_ref: refs/heads/main

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/heads/main

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Version not found in Directory.Build.props."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check changelog entry
        shell: bash
        run: |
          version='${{ steps.version.outputs.version }}'
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes-check.txt

          if [ ! -s /tmp/release-notes-check.txt ]; then
            echo "Missing changelog entry for version $version" >&2
            exit 1
          fi

      - name: Check whether release tag already exists
        id: tag_check
        shell: bash
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release tag $tag already exists. Skipping artifact build and publication."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows Release Artifacts
    runs-on: windows-latest
    needs:
      - prepare-release
    if: needs.prepare-release.outputs.tag_exists != 'true'
    outputs:
      version: ${{ needs.prepare-release.outputs.version }}
      tag: ${{ needs.prepare-release.outputs.tag }}
      target_ref: ${{ needs.prepare-release.outputs.target_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.target_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ImmichFolderWatch.sln

      - name: Build Windows MSI
        shell: pwsh
        run: .\packaging\windows\build-msi.ps1 -Runtime win-x64 -Version ${{ needs.prepare-release.outputs.version }}

      - name: Collect release assets
        shell: pwsh
        run: |
          $assetRoot = Join-Path $PWD "artifacts\release"
          New-Item -ItemType Directory -Path $assetRoot -Force | Out-Null

          Copy-Item `
            -LiteralPath (Join-Path $PWD "artifacts\windows\msi\immich-folder-watch-${{ needs.prepare-release.outputs.version }}-win-x64.msi") `
            -Destination (Join-Path $assetRoot "immich-folder-watch-${{ needs.prepare-release.outputs.version }}-win-x64.msi")

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: immich-folder-watch-windows-assets
          path: artifacts/release

  build-flatpak:
    name: Build Linux Flatpak Bundle
    runs-on: ubuntu-latest
    needs:
      - prepare-release
    if: needs.prepare-release.outputs.tag_exists != 'true'
    # Plain Fedora container instead of the flatpak-github-actions image:
    # Fedora tracks a recent flatpak-builder and lets this workflow install
    # the exact runtime/sdk/extension set it needs. --privileged is still
    # required for flatpak-builder's sandbox and ostree bind mounts.
    container:
      image: fedora:latest
      options: --privileged

    steps:
      - name: Install flatpak toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            flatpak flatpak-builder ostree git tar gzip xz which \
            python3 python3-pyyaml
          flatpak-builder --version
          flatpak remote-add --system --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --system -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.dotnet10//24.08

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.target_ref }}

      - name: Trust checkout directory for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Generate offline NuGet feed
        run: tools/generate-nuget-sources.sh

      - name: Inject AppStream release block
        run: |
          tools/update-appstream.py \
            "${{ needs.prepare-release.outputs.version }}" \
            --metainfo packaging/flatpak/io.github.voltkraft.ImmichFolderWatch.metainfo.xml

      - name: Create Flatpak source archive
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z \
            | tar --create --gzip --file packaging/flatpak/source.tar.gz \
                --null --files-from -

          tar --list --gzip --file packaging/flatpak/source.tar.gz \
            | grep -Fx 'src/ImmichFolderWatch.App.Linux/ImmichFolderWatch.App.Linux.csproj' >/dev/null

      - name: Pre-resolve manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/resolve-flatpak-manifest.py \
            packaging/flatpak/io.github.voltkraft.ImmichFolderWatch.yaml \
            packaging/flatpak/io.github.voltkraft.ImmichFolderWatch.resolved.json
          python3 tools/normalize-flatpak-manifest-paths.py \
            packaging/flatpak/io.github.voltkraft.ImmichFolderWatch.resolved.json \
            --manifest-dir packaging/flatpak

      - name: Build + bundle Flatpak
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("packaging/flatpak/io.github.voltkraft.ImmichFolderWatch.resolved.json").read_text(encoding="utf-8"))
          module = next(module for module in data["modules"] if module["name"] == "immich-folder-watch")
          commands = module["build-commands"]
          build_args = module.get("build-options", {}).get("build-args", [])

          if any(command == "tar -xzf source.tar.gz && rm source.tar.gz" for command in commands):
              raise SystemExit("Resolved manifest still contains the unmounted source archive command.")
          if not any(command.startswith("tar -xzf /") and command.endswith("/source.tar.gz") for command in commands):
              raise SystemExit("Resolved manifest does not unpack source.tar.gz from an absolute mounted path.")
          if not any(arg.startswith("--filesystem=/") and arg.endswith("/packaging/flatpak:ro") for arg in build_args):
              raise SystemExit("Resolved manifest does not mount packaging/flatpak into the build sandbox.")
          PY
          # Keep flatpak-builder state on the same filesystem as the
          # workspace for ostree hardlinks, but outside the checkout so
          # generated state can never be packed into the app source.
          mkdir -p /__w/fb-state
          flatpak-builder \
            --repo=repo \
            --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --force-clean \
            --default-branch=master \
            --arch=x86_64 \
            --ccache \
            --verbose \
            --state-dir /__w/fb-state \
            flatpak_app \
            packaging/flatpak/io.github.voltkraft.ImmichFolderWatch.resolved.json
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo \
            "immich-folder-watch-${VERSION}.flatpak" \
            io.github.voltkraft.ImmichFolderWatch \
            master

      - name: Stage release asset
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          mkdir -p artifacts/release
          mv "immich-folder-watch-${VERSION}.flatpak" \
             "artifacts/release/immich-folder-watch-${VERSION}.flatpak"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: immich-folder-watch-flatpak-assets
          path: artifacts/release

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-windows
      - build-flatpak
    if: |
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.prepare-release.outputs.tag_exists != 'true' &&
      needs.build-windows.result == 'success' &&
      needs.build-flatpak.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.target_ref }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: immich-folder-watch-windows-assets
          path: artifacts/release

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v7
        with:
          name: immich-folder-watch-flatpak-assets
          path: artifacts/release

      - name: Extract changelog entry
        shell: bash
        run: |
          version='${{ needs.prepare-release.outputs.version }}'
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Missing changelog entry for version $version" >&2
            exit 1
          fi

      - name: Create immutable release tag
        env:
          TAG_NAME: ${{ needs.prepare-release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "refs/tags/$TAG_NAME"

      - name: Publish release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: artifacts/release/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger WinGet workflow
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "winget.yaml",
              ref: "main",
              inputs: {
                release_tag: process.env.RELEASE_TAG,
              },
            });
