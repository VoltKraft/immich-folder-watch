name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == 'main'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.tag_check.outputs.tag_exists }}
      target_sha: ${{ steps.target.outputs.sha }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'refs/heads/main' }}

      - name: Resolve release commit
        id: target
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Version not found in Directory.Build.props."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check changelog entry
        shell: bash
        run: |
          version='${{ steps.version.outputs.version }}'
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes-check.txt

          if [ ! -s /tmp/release-notes-check.txt ]; then
            echo "Missing changelog entry for version $version" >&2
            exit 1
          fi

      - name: Check whether release tag already exists
        id: tag_check
        shell: bash
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release tag $tag already exists. Skipping artifact build and publication."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows Release Artifacts
    runs-on: windows-latest
    needs:
      - prepare-release
    if: needs.prepare-release.outputs.tag_exists != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ImmichFolderWatch.sln

      - name: Build Windows MSI
        shell: pwsh
        run: .\packaging\windows\build-msi.ps1 -Runtime win-x64 -Version ${{ needs.prepare-release.outputs.version }}

      - name: Collect release assets
        shell: pwsh
        run: |
          $assetRoot = Join-Path $PWD "artifacts\release"
          New-Item -ItemType Directory -Path $assetRoot -Force | Out-Null

          Copy-Item `
            -LiteralPath (Join-Path $PWD "artifacts\windows\msi\immich-folder-watch-${{ needs.prepare-release.outputs.version }}-win-x64.msi") `
            -Destination (Join-Path $assetRoot "immich-folder-watch-${{ needs.prepare-release.outputs.version }}-win-x64.msi")

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: immich-folder-watch-windows-assets
          path: artifacts/release

  build-flatpak:
    name: Build Linux Flatpak Bundle
    runs-on: ubuntu-latest
    needs:
      - prepare-release
    if: needs.prepare-release.outputs.tag_exists != 'true'
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install .NET Flatpak SDK extension
        run: |
          flatpak remote-add --system --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --system --noninteractive -y flathub \
            org.freedesktop.Sdk.Extension.dotnet10//25.08

      - name: Generate offline NuGet sources
        run: tools/generate-nuget-sources.sh

      - name: Prepare commit-pinned release manifest
        env:
          TARGET_SHA: ${{ needs.prepare-release.outputs.target_sha }}
        run: |
          mkdir -p artifacts/flatpak-release
          python3 tools/prepare-flatpak-release-manifest.py \
            --source packaging/flatpak/flathub/io.github.voltkraft.immich-folder-watch.yml \
            --output artifacts/flatpak-release/io.github.voltkraft.immich-folder-watch.yml \
            --commit "$TARGET_SHA"
          cp packaging/flatpak/flathub/nuget-sources.json \
            artifacts/flatpak-release/nuget-sources.json

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: artifacts/flatpak-release/io.github.voltkraft.immich-folder-watch.yml
          bundle: immich-folder-watch-${{ needs.prepare-release.outputs.version }}.flatpak
          artifact-name: immich-folder-watch-flatpak-assets
          arch: x86_64
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-windows
      - build-flatpak
    if: |
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.prepare-release.outputs.tag_exists != 'true' &&
      needs.build-windows.result == 'success' &&
      needs.build-flatpak.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: immich-folder-watch-windows-assets
          path: artifacts/release

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v7
        with:
          name: immich-folder-watch-flatpak-assets
          path: artifacts/release

      - name: Extract changelog entry
        shell: bash
        run: |
          version='${{ needs.prepare-release.outputs.version }}'
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Missing changelog entry for version $version" >&2
            exit 1
          fi

      - name: Create immutable release tag
        env:
          TAG_NAME: ${{ needs.prepare-release.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare-release.outputs.target_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" "$TARGET_SHA"
          git push origin "refs/tags/$TAG_NAME"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: artifacts/release/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger WinGet workflow
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "winget.yaml",
              ref: "main",
              inputs: {
                release_tag: process.env.RELEASE_TAG,
              },
            });
