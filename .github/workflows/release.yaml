name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == 'main'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.tag_check.outputs.tag_exists }}
      target_ref: refs/heads/main

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/heads/main

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Version not found in Directory.Build.props."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check changelog entry
        shell: bash
        run: |
          version='${{ steps.version.outputs.version }}'
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes-check.txt

          if [ ! -s /tmp/release-notes-check.txt ]; then
            echo "Missing changelog entry for version $version" >&2
            exit 1
          fi

      - name: Check whether release tag already exists
        id: tag_check
        shell: bash
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release tag $tag already exists. Skipping artifact build and publication."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows Release Artifacts
    runs-on: windows-latest
    needs:
      - prepare-release
    if: needs.prepare-release.outputs.tag_exists != 'true'
    outputs:
      version: ${{ needs.prepare-release.outputs.version }}
      tag: ${{ needs.prepare-release.outputs.tag }}
      target_ref: ${{ needs.prepare-release.outputs.target_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.target_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ImmichFolderWatch.sln

      - name: Build Windows MSI
        shell: pwsh
        run: .\packaging\windows\build-msi.ps1 -Runtime win-x64 -Version ${{ needs.prepare-release.outputs.version }}

      - name: Collect release assets
        shell: pwsh
        run: |
          $assetRoot = Join-Path $PWD "artifacts\release"
          New-Item -ItemType Directory -Path $assetRoot -Force | Out-Null

          Copy-Item `
            -LiteralPath (Join-Path $PWD "artifacts\windows\msi\immich-folder-watch-${{ needs.prepare-release.outputs.version }}-win-x64.msi") `
            -Destination (Join-Path $assetRoot "immich-folder-watch-${{ needs.prepare-release.outputs.version }}-win-x64.msi")

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: immich-folder-watch-windows-assets
          path: artifacts/release

  build-flatpak:
    name: Build Linux Flatpak Bundle
    runs-on: ubuntu-latest
    needs:
      - prepare-release
    if: needs.prepare-release.outputs.tag_exists != 'true'
    # The official flatpak/flatpak-github-actions image — Fedora-based,
    # ships flatpak + flatpak-builder + ostree + xvfb-run, and has the
    # freedesktop runtime/sdk/dotnet10 extension pre-cached. Running
    # inside this container with --privileged sidesteps the polkit
    # `Deploy not allowed for user` failure we hit on bare ubuntu-latest
    # when flatpak-builder did `flatpak --system install` of the runtime.
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.target_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Generate offline NuGet feed
        run: tools/generate-nuget-sources.sh

      - name: Inject AppStream release block
        run: |
          tools/update-appstream.py \
            "${{ needs.prepare-release.outputs.version }}" \
            --metainfo packaging/flatpak/io.github.voltkraft.ImmichFolderWatch.metainfo.xml

      - name: Pre-resolve manifest (inline external nuget-sources fragment)
        # flatpak-builder 1.4.4 (the container's version) silently fails
        # to deserialize the manifest's `sources` array when it mixes a
        # string entry (`- nuget-sources.json`, the external-fragment
        # shorthand) with structured source objects. The build proceeds
        # but the `type: dir` entry doesn't materialize, so dotnet
        # publish later hits "MSBUILD : error MSB1009: Project file does
        # not exist". `--show-manifest` resolves the fragment in-place
        # and emits a JSON manifest with only structured entries — the
        # builder is happy with that. flatpak-builder 1.4.8 locally
        # accepts either form, but the container is what matters here.
        run: |
          flatpak-builder --show-manifest \
            packaging/flatpak/io.github.voltkraft.ImmichFolderWatch.yaml \
            > packaging/flatpak/io.github.voltkraft.ImmichFolderWatch.resolved.json

      - name: Build + bundle Flatpak
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          # state-dir outside the source path. With it inside (the
          # default `.flatpak-builder` next to the YAML), 1.4.4 in the
          # container silently failed to materialize any of the 70
          # sources into the build dir and the dotnet publish hit
          # MSB1009. Pulling state out of the recursion path makes the
          # source copy deterministic. /tmp also has the right
          # filesystem semantics for ostree's atomic operations.
          flatpak-builder \
            --repo=repo \
            --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --force-clean \
            --default-branch=master \
            --arch=x86_64 \
            --ccache \
            --verbose \
            --state-dir /tmp/flatpak-builder-state \
            flatpak_app \
            packaging/flatpak/io.github.voltkraft.ImmichFolderWatch.resolved.json
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo \
            "immich-folder-watch-${VERSION}.flatpak" \
            io.github.voltkraft.ImmichFolderWatch \
            master

      - name: Stage release asset
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          mkdir -p artifacts/release
          mv "immich-folder-watch-${VERSION}.flatpak" \
             "artifacts/release/immich-folder-watch-${VERSION}.flatpak"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: immich-folder-watch-flatpak-assets
          path: artifacts/release

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-windows
      - build-flatpak
    if: |
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.prepare-release.outputs.tag_exists != 'true' &&
      needs.build-windows.result == 'success' &&
      needs.build-flatpak.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.target_ref }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: immich-folder-watch-windows-assets
          path: artifacts/release

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v7
        with:
          name: immich-folder-watch-flatpak-assets
          path: artifacts/release

      - name: Extract changelog entry
        shell: bash
        run: |
          version='${{ needs.prepare-release.outputs.version }}'
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Missing changelog entry for version $version" >&2
            exit 1
          fi

      - name: Create immutable release tag
        env:
          TAG_NAME: ${{ needs.prepare-release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "refs/tags/$TAG_NAME"

      - name: Publish release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: artifacts/release/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger WinGet workflow
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "winget.yaml",
              ref: "main",
              inputs: {
                release_tag: process.env.RELEASE_TAG,
              },
            });
