name: Flatpak Placeholder Build

on:
  push:
    paths:
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak-build.yml'
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak-build.yml'
  workflow_dispatch:

jobs:
  flatpak-placeholder:
    name: Validate Flatpak Placeholder
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest exists
        run: test -f packaging/flatpak/io.github.immich_folder_watch.yml

      - name: Show placeholder note
        run: echo "Flatpak implementation is a placeholder and allowed to fail."
