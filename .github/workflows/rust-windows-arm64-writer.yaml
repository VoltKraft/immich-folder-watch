name: Rust Windows ARM64 standard-user writer

on:
  push:
    branches: [rewrite/rust]
    paths:
      # Replay and reporting changes can be checked against the original observation archives.
      - 'tools/rust-qa/instance/cross-session/hosted-arm64/run.ps1'
      - 'tools/rust-qa/instance/cross-session/hosted-arm64/case.py'
      - 'tools/rust-qa/instance/cross-session/hosted-arm64/inputs.py'
      - 'tools/rust-qa/instance/cross-session/hosted-arm64/logon.py'
      - 'tools/rust-qa/instance/cross-session/hosted-arm64/batch_account.py'
      - 'tools/rust-qa/instance/cross-session/batch.py'
      - 'tools/rust-qa/instance/cross-session/console_levels.py'
      - 'tools/rust-qa/instance/cross-session/fixture.py'
      - 'tools/rust-qa/instance/cross-session/native_build.py'
      - 'tools/rust-qa/instance/cross-session/observe.py'
      - 'tools/rust-qa/instance/cross-session/scheduler.ps1'
      - 'tools/rust-qa/instance/cross-session/scheduler_cleanup.ps1'
      - 'tools/rust-qa/instance/cross-session/standard.py'
      - 'tools/rust-qa/instance/cross-session/worker.py'
      - 'tools/rust-qa/instance/*.rs'
      - 'tools/rust-qa/instance/Program.cs'
      - 'tools/rust-qa/instance/InstanceOracle.csproj'
      - 'tools/rust-qa/instance/run.py'
      - 'tools/rust-qa/instance/legacy-inputs.json'
      - 'tools/rust-qa/gui/src/win32_instance.rs'
      - 'src/ImmichFolderWatch.App/Services/SingleInstanceCoordinator.cs'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  observe:
    if: github.repository == 'VoltKraft/immich-folder-watch' && github.ref == 'refs/heads/rewrite/rust'
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.401
          architecture: arm64

      - name: Verify the original tested ARM64 writer and identity oracle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B tools/rust-qa/instance/cross-session/hosted-arm64/inputs.py download

      - name: Exercise the new ordinary user's two local logons
        id: observe
        shell: pwsh
        run: ./tools/rust-qa/instance/cross-session/hosted-arm64/run.ps1

      - name: Replay the original lock events and tokens
        if: ${{ !cancelled() && steps.observe.outcome != 'skipped' }}
        shell: pwsh
        run: python -I -B tools/rust-qa/instance/cross-session/hosted-arm64/replay.py artifacts/rust/arm64-standard-writer --check functional

      - name: Verify disposable host cleanup
        if: ${{ !cancelled() && steps.observe.outcome != 'skipped' }}
        shell: pwsh
        run: python -I -B tools/rust-qa/instance/cross-session/hosted-arm64/replay.py artifacts/rust/arm64-standard-writer --check cleanup

      - name: Retain the native archive and redacted test observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-standard-writer-arm64-${{ github.sha }}
          path: |
            artifacts/rust/arm64-standard-writer/writer.zip
            artifacts/rust/arm64-standard-writer/observer-sources.json
            artifacts/rust/arm64-standard-writer/host.json
            artifacts/rust/arm64-standard-writer/case.json
            artifacts/rust/arm64-standard-writer/worker-done.json
            artifacts/rust/arm64-standard-writer/original-bootstrap-done.json
          if-no-files-found: error
          retention-days: 14
