app-id: io.github.voltkraft.ImmichFolderWatch
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: immich-folder-watch

build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

finish-args:
  # X11/Wayland shared memory
  - --share=ipc
  # Primary display server
  - --socket=wayland
  # XWayland — required as well as Wayland because Avalonia 11.2.x's
  # UsePlatformDetect() still chooses the X11 backend on Linux. Drop
  # this back to fallback-x11 once Avalonia ships stable Wayland-native.
  - --socket=x11
  # Immich API + Socket.IO realtime
  - --share=network
  # Avalonia GPU compositor
  - --device=dri
  # Toasts
  - --talk-name=org.freedesktop.Notifications
  # Tray on KDE Plasma + AppIndicator-extended GNOME
  - --talk-name=org.kde.StatusNotifierWatcher
  # SNI clients have to claim their own well-known bus name in the
  # form org.kde.StatusNotifierItem-<pid>-<id> so the Watcher can
  # call back into them for icon / menu / activation. Without this
  # own-name grant the Flatpak D-Bus proxy refuses the registration,
  # the Watcher's callback fails with ServiceUnknown, and Avalonia
  # quietly drops the tray icon. xdg-dbus-proxy only honours
  # subtree wildcards (`.*` after a full segment), not in-segment
  # patterns like `StatusNotifierItem-*`, so the org.kde.* form is
  # the narrowest grant that actually covers the suffixed name.
  - --own-name=org.kde.*
  # FileChooser, Settings, Notification portals
  - --talk-name=org.freedesktop.portal.Desktop
  # Resolve doc-portal handles returned by the FileChooser portal —
  # without this, Avalonia's TryGetLocalPath() blocks on a D-Bus call
  # the Flatpak proxy refuses, freezing the UI thread.
  - --talk-name=org.freedesktop.portal.Documents
  # Autostart consent + run-in-background
  - --talk-name=org.freedesktop.portal.Background
  # Browse-only fallback so the FileChooser portal can preview thumbnails
  # — actual watch I/O goes through doc-portal handles, not these grants.
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro

modules:
  - name: immich-folder-watch
    buildsystem: simple
    sources:
      # CI builds tarball the source at release time and reference it
      # via type:archive — a different flatpak-builder source code path
      # than type:dir, which 1.4.4 (the bilelmoussaoui/freedesktop-24.08
      # container's version) silently refuses to materialize. The
      # tarball lives next to the manifest at build time only and is
      # gitignored.
      #
      # Local builds from the dev shell rebuild the tarball on demand
      # before invoking flatpak-builder; see packaging/flatpak/README.md
      # for the updated developer flow.
      - type: archive
        path: source.tar.gz
        # Tarball is created with `tar czf ... .` from the repo root,
        # so contents already sit at the top level. Default of 1 would
        # eat the src/ prefix.
        strip-components: 0
      - nuget-sources.json
    build-commands:
      # TEMP debug: log what flatpak-builder actually staged in the
      # build dir before dotnet publish runs. Remove once the v2.5.1
      # build is green.
      - 'echo "=== build dir cwd ===" && pwd'
      - 'echo "=== top-level contents ===" && ls -la'
      - 'echo "=== src/ contents ===" && (ls -la src/ || echo "src/ MISSING")'
      - 'echo "=== nuget-sources/ count ===" && (ls nuget-sources/ | wc -l || echo "nuget-sources/ MISSING")'
      - >-
        dotnet publish
        src/ImmichFolderWatch.App.Linux/ImmichFolderWatch.App.Linux.csproj
        --configuration Release
        --runtime linux-x64
        --self-contained true
        --source ./nuget-sources
        -p:PublishSingleFile=false
        -p:UseAppHost=true
        --output ${FLATPAK_DEST}/lib/immich-folder-watch
      - install -dm755 ${FLATPAK_DEST}/bin
      - ln -sf /app/lib/immich-folder-watch/immich-folder-watch ${FLATPAK_DEST}/bin/immich-folder-watch
      - install -Dm644 packaging/flatpak/io.github.voltkraft.ImmichFolderWatch.desktop
          ${FLATPAK_DEST}/share/applications/io.github.voltkraft.ImmichFolderWatch.desktop
      - install -Dm644 packaging/flatpak/io.github.voltkraft.ImmichFolderWatch.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/io.github.voltkraft.ImmichFolderWatch.metainfo.xml
      - install -Dm644 packaging/flatpak/icons/scalable/apps/io.github.voltkraft.ImmichFolderWatch.svg
          ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.voltkraft.ImmichFolderWatch.svg
      - install -Dm644 packaging/flatpak/icons/512x512/apps/io.github.voltkraft.ImmichFolderWatch.png
          ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.voltkraft.ImmichFolderWatch.png
