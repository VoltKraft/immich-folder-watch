app-id: io.github.voltkraft.immich-folder-watch
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: immich-folder-watch

build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

finish-args:
  - --share=ipc
  - --socket=x11
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: immich-folder-watch
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/VoltKraft/immich-folder-watch.git
        tag: v2.5.3
        commit: REPLACE_WITH_V2_5_3_COMMIT_SHA
        x-checker-data:
          type: json
          url: https://api.github.com/repos/VoltKraft/immich-folder-watch/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^v"; "")
          timestamp-query: .published_at
      # Sibling file regenerated by the GitHub release workflow and, after a
      # future Flathub submission, committed in the per-app Flathub repo.
      - nuget-sources.json
    build-commands:
      - |
        case "${FLATPAK_ARCH}" in
          x86_64) dotnet_runtime=linux-x64 ;;
          aarch64) dotnet_runtime=linux-arm64 ;;
          *) echo "Unsupported Flatpak architecture: ${FLATPAK_ARCH}" >&2; exit 1 ;;
        esac
        dotnet publish \
          src/ImmichFolderWatch.App.Linux/ImmichFolderWatch.App.Linux.csproj \
          --configuration Release \
          --runtime "${dotnet_runtime}" \
          --self-contained true \
          --source ./nuget-sources \
          -p:PublishSingleFile=false \
          -p:UseAppHost=true \
          --output ${FLATPAK_DEST}/lib/immich-folder-watch
      - install -dm755 ${FLATPAK_DEST}/bin
      - ln -sf /app/lib/immich-folder-watch/immich-folder-watch ${FLATPAK_DEST}/bin/immich-folder-watch
      - install -Dm644 packaging/flatpak/io.github.voltkraft.immich-folder-watch.desktop
          ${FLATPAK_DEST}/share/applications/io.github.voltkraft.immich-folder-watch.desktop
      - install -Dm644 packaging/flatpak/io.github.voltkraft.immich-folder-watch.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/io.github.voltkraft.immich-folder-watch.metainfo.xml
      - install -Dm644 packaging/flatpak/icons/scalable/apps/io.github.voltkraft.immich-folder-watch.svg
          ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.voltkraft.immich-folder-watch.svg
      - install -Dm644 packaging/flatpak/icons/512x512/apps/io.github.voltkraft.immich-folder-watch.png
          ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.voltkraft.immich-folder-watch.png
