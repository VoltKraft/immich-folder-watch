app-id: io.github.voltkraft.immich-folder-watch
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: immich-folder-watch

build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

finish-args:
  - --share=ipc
  - --socket=x11
  - --share=network
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: immich-folder-watch
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/VoltKraft/immich-folder-watch.git
        tag: v2.11.0
        commit: ddfbf46f66731302f243909f148d982e88154a52
      # The release updater pins the source and regenerates the complete
      # offline feed together; a tag-only checker would leave stale packages.
      - nuget-sources.json
    build-commands:
      - |
        case "${FLATPAK_ARCH}" in
          x86_64) dotnet_runtime=linux-x64 ;;
          aarch64) dotnet_runtime=linux-arm64 ;;
          *) echo "Unsupported Flatpak architecture: ${FLATPAK_ARCH}" >&2; exit 1 ;;
        esac
        dotnet publish \
          src/ImmichFolderWatch.App.Linux/ImmichFolderWatch.App.Linux.csproj \
          --configuration Release \
          --runtime "${dotnet_runtime}" \
          --self-contained true \
          --source ./nuget-sources \
          -p:PublishSingleFile=false \
          -p:UseAppHost=true \
          --output ${FLATPAK_DEST}/lib/immich-folder-watch
      - install -dm755 ${FLATPAK_DEST}/bin
      - ln -sf /app/lib/immich-folder-watch/immich-folder-watch ${FLATPAK_DEST}/bin/immich-folder-watch
      - install -Dm644 packaging/flatpak/io.github.voltkraft.immich-folder-watch.desktop
          ${FLATPAK_DEST}/share/applications/io.github.voltkraft.immich-folder-watch.desktop
      - install -Dm644 packaging/flatpak/io.github.voltkraft.immich-folder-watch.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/io.github.voltkraft.immich-folder-watch.metainfo.xml
      - install -Dm644 artifacts/branding/flatpak/io.github.voltkraft.immich-folder-watch.png
          ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.voltkraft.immich-folder-watch.png
      - install -Dm644 THIRD_PARTY_NOTICES.md
          ${FLATPAK_DEST}/share/licenses/io.github.voltkraft.immich-folder-watch/THIRD_PARTY_NOTICES.md
      - |
        python3 tools/install-flatpak-license-notices.py \
          --source-dir nuget-sources \
          --output-dir ${FLATPAK_DEST}/share/licenses/io.github.voltkraft.immich-folder-watch/nuget \
          --supplemental-dir packaging/flatpak/licenses
