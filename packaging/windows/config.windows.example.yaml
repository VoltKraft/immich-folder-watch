immich:
  serverApiUrl: "https://immich.example.com/api"
  apiKey: "REPLACE_WITH_IMMICH_API_KEY"

watch:
  sources:
    - path: "C:\\Users\\YOUR_USER\\Pictures"
      albumName: "Pictures"
      syncMode: "uploadNew" # uploadNew (default) | uploadAll | sync
      includeSubdirectories: true
      extensions:
        - ".3fr"
        - ".3gp"
        - ".3gpp"
        - ".ari"
        - ".arw"
        - ".avi"
        - ".avif"
        - ".bmp"
        - ".cap"
        - ".cin"
        - ".cr2"
        - ".cr3"
        - ".crw"
        - ".dcr"
        - ".dng"
        - ".erf"
        - ".fff"
        - ".flv"
        - ".gif"
        - ".heic"
        - ".heif"
        - ".hif"
        - ".iiq"
        - ".insp"
        - ".insv"
        - ".jp2"
        - ".jpe"
        - ".jpeg"
        - ".jpg"
        - ".jxl"
        - ".k25"
        - ".kdc"
        - ".m2t"
        - ".m2ts"
        - ".m4v"
        - ".mkv"
        - ".mov"
        - ".mp4"
        - ".mpe"
        - ".mpeg"
        - ".mpg"
        - ".mrw"
        - ".mts"
        - ".nef"
        - ".nrw"
        - ".orf"
        - ".ori"
        - ".pef"
        - ".png"
        - ".psd"
        - ".raf"
        - ".raw"
        - ".rw2"
        - ".rwl"
        - ".sr2"
        - ".srf"
        - ".srw"
        - ".svg"
        - ".tif"
        - ".tiff"
        - ".vob"
        - ".webm"
        - ".webp"
        - ".wmv"
        - ".x3f"
      excludeDirectories:
        - "private"
        - "**/cache"
      excludeFileNames:
        - "Thumbs.db"
        - "*.tmp"
  batchIntervalSeconds: 5
  maxBatchSize: 25
  fileReadyTimeoutSeconds: 30

retry:
  maxAttempts: 5
  baseDelayMilliseconds: 500

logging:
  level: "Information"
  logDirectory: "C:\\ProgramData\\Immich Folder Watch\\logs"

localization:
  language: "auto" # auto | en | de
